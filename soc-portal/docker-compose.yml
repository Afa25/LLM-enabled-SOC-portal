# ╔══════════════════════════════════════════════════════════════════╗
# ║         OPEN-SOURCE SOC PLATFORM — DOCKER COMPOSE               ║
# ║  Wazuh · Grafana · Zeek · Suricata · OpenCTI · Velociraptor     ║
# ║  Ollama · Portal                                                 ║
# ╚══════════════════════════════════════════════════════════════════╝

networks:
  soc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  wazuh-certs:
  wazuh-indexer-data:
  wazuh-manager-data:
  wazuh-logs:
  grafana-data:
  prometheus-data:
  prometheus-targets:
  ollama-models:
  portal-db:
  portal-backups:
  zeek-logs:
  suricata-logs:
  nginx-logs:
  nginx-certs:
  wazuh-dashboard-config:
  opencti-elasticsearch-data:
  opencti-redis-data:
  opencti-rabbitmq-data:
  opencti-minio-data:
  velociraptor-data:
  yara-rules-data:
  sigma-rules-data:

services:

  # ────────────────────────────────────────────────────────────────
  # KERNEL INIT — sets vm.max_map_count for Elasticsearch/OpenSearch
  # Required on native Linux. Docker Desktop pre-sets this; Ubuntu does not.
  # ────────────────────────────────────────────────────────────────
  sysctl-init:
    image: alpine
    container_name: soc-sysctl-init
    restart: "no"
    privileged: true
    command: sh -c "sysctl -w vm.max_map_count=262144 && echo 'vm.max_map_count set to 262144'"

  # ────────────────────────────────────────────────────────────────
  # WAZUH CERT GENERATOR — runs once, generates all Wazuh certs
  # ────────────────────────────────────────────────────────────────
  wazuh-certgen:
    image: wazuh/wazuh-certs-generator:0.0.2
    container_name: soc-wazuh-certgen
    hostname: wazuh-certs-generator
    command: generate-indexer-certs
    restart: "no"
    volumes:
      - ./configs/wazuh/certs.yml:/config/certs.yml
      - wazuh-certs:/certificates/

  # ────────────────────────────────────────────────────────────────
  # WAZUH CERTS PERMISSION FIX — makes cert dir traversable after certgen
  # ────────────────────────────────────────────────────────────────
  wazuh-certs-fix:
    image: alpine
    container_name: soc-wazuh-certs-fix
    restart: "no"
    depends_on:
      - wazuh-certgen
    volumes:
      - wazuh-certs:/certificates
    command: sh -c "chmod -R 755 /certificates && chown -R 1000:0 /certificates && echo 'Cert directory permissions fixed.'"

  # ────────────────────────────────────────────────────────────────
  # WAZUH INDEXER (OpenSearch)
  # ────────────────────────────────────────────────────────────────
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.12.0
    container_name: soc-wazuh-indexer
    restart: unless-stopped
    hostname: wazuh-indexer
    mem_limit: 2g
    memswap_limit: 2g
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx1g -XX:MaxDirectMemorySize=512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./configs/wazuh/indexer/opensearch.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - wazuh-certs:/usr/share/wazuh-indexer/certs:ro
    networks:
      soc-net:
        ipv4_address: 172.20.0.10
    depends_on:
      - sysctl-init
      - wazuh-certs-fix
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/9200' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  # ────────────────────────────────────────────────────────────────
  # WAZUH MANAGER
  # ────────────────────────────────────────────────────────────────
  wazuh-manager:
    image: wazuh/wazuh-manager:4.12.0
    container_name: soc-wazuh-manager
    restart: unless-stopped
    hostname: wazuh-manager
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/wazuh/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/wazuh/wazuh.manager.pem
      - SSL_KEY=/etc/ssl/wazuh/wazuh.manager-key.pem
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-logs:/var/ossec/logs
      - ./configs/wazuh/manager/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./configs/wazuh/manager/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./configs/wazuh/manager/filebeat.yml:/etc/filebeat/filebeat.yml
      - ./configs/wazuh/manager/s6/filebeat-run:/etc/services.d/filebeat/run
      - wazuh-certs:/etc/ssl/wazuh:ro
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    networks:
      soc-net:
        ipv4_address: 172.20.0.11
    depends_on:
      wazuh-indexer:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────
  # WAZUH DASHBOARD
  # ────────────────────────────────────────────────────────────────
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.12.0
    container_name: soc-wazuh-dashboard
    restart: unless-stopped
    hostname: wazuh-dashboard
    mem_limit: 512m
    memswap_limit: 512m
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - ./configs/wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - wazuh-certs:/usr/share/wazuh-dashboard/certs:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
    networks:
      soc-net:
        ipv4_address: 172.20.0.12
    depends_on:
      wazuh-indexer:
        condition: service_healthy
      wazuh-manager:
        condition: service_started

  # ────────────────────────────────────────────────────────────────
  # GRAFANA
  # ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: soc-grafana
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # SSO — auth proxy: nginx passes X-WEBAUTH-USER from the portal session.
      # Portal-authenticated users are logged into Grafana as Admin automatically.
      # Direct Grafana login (admin credentials from .env) still works.
      - GF_AUTH_PROXY_ENABLED=true
      - GF_AUTH_PROXY_HEADER_NAME=X-WEBAUTH-USER
      - GF_AUTH_PROXY_HEADER_PROPERTY=username
      - GF_AUTH_PROXY_AUTO_SIGN_UP=true
      - GF_AUTH_PROXY_HEADERS=Role:X-WEBAUTH-ROLE
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_NEWS_NEWS_FEED_ENABLED=false
      - WAZUH_INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      soc-net:
        ipv4_address: 172.20.0.13
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────────────
  # PROMETHEUS — metrics collection, proxied at /prometheus/ via nginx
  # ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: soc-prometheus
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/'
    volumes:
      - prometheus-data:/prometheus
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-targets:/etc/prometheus/targets
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      soc-net:
        ipv4_address: 172.20.0.14

  # ────────────────────────────────────────────────────────────────
  # NODE EXPORTER — host system metrics for Prometheus
  # ────────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: soc-node-exporter
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      soc-net:
        ipv4_address: 172.20.0.50

  # ────────────────────────────────────────────────────────────────
  # ZEEK (network traffic analysis)
  # Using zeekurity/zeek — the correct public image
  # ────────────────────────────────────────────────────────────────
  zeek:
    image: zeek/zeek:lts
    container_name: soc-zeek
    restart: on-failure
    mem_limit: 256m
    memswap_limit: 256m
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - zeek-logs:/usr/local/zeek/logs
      - ./configs/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
    environment:
      - ZEEK_INTERFACE=${SOC_NETWORK_INTERFACE:-eth0}
    command: zeek -i ${SOC_NETWORK_INTERFACE:-eth0} /usr/local/zeek/share/zeek/site/local.zeek LogAscii::use_json=T -C

  # ────────────────────────────────────────────────────────────────
  # SURICATA (network IDS/IPS)
  # ────────────────────────────────────────────────────────────────
  suricata:
    image: jasonish/suricata:latest
    container_name: soc-suricata
    restart: on-failure
    mem_limit: 512m
    memswap_limit: 512m
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_NICE
    volumes:
      - suricata-logs:/var/log/suricata
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml
    command: -i ${SOC_NETWORK_INTERFACE:-eth0} --af-packet -D --init-errors-fatal

  # ────────────────────────────────────────────────────────────────
  # OLLAMA (local LLM — no API key needed)
  # ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.4.7
    container_name: soc-ollama
    restart: unless-stopped
    mem_limit: 6g
    memswap_limit: 6g
    environment:
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_NUM_PARALLEL=1
    volumes:
      - ollama-models:/root/.ollama
    networks:
      soc-net:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/11434' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────────
  # OLLAMA MODEL PULLER (runs once, then exits)
  # ────────────────────────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:0.4.7
    container_name: soc-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling ${OLLAMA_MODEL:-llama3.2:3b} (first run only)..."
        ollama pull ${OLLAMA_MODEL:-llama3.2:3b}
        echo "Model ready."
    networks:
      soc-net:

  # ────────────────────────────────────────────────────────────────
  # SOC PORTAL
  # ────────────────────────────────────────────────────────────────
  soc-portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: soc-portal
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    environment:
      - NODE_ENV=production
      - PORT=4000
      - WAZUH_MANAGER_URL=https://wazuh-manager:55000
      - WAZUH_USER=wazuh-wui
      - WAZUH_PASS=${WAZUH_API_PASSWORD}
      - WAZUH_INDEXER_URL=https://wazuh-indexer:9200
      - WAZUH_INDEXER_USER=admin
      - WAZUH_INDEXER_PASS=${WAZUH_INDEXER_PASSWORD}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      # TLS: CA cert is mounted below. Set WAZUH_TLS_SKIP_VERIFY=true in .env
      # only if you have not yet deployed the Wazuh certs directory.
      - WAZUH_CA_CERT=/app/certs/root-ca.pem
      - WAZUH_TLS_SKIP_VERIFY=${WAZUH_TLS_SKIP_VERIFY:-false}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_USER=${GRAFANA_USER:-admin}
      - GRAFANA_PASS=${GRAFANA_PASSWORD}
      - OPENCTI_URL=http://opencti:8080/opencti
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - VELOCIRAPTOR_URL=http://velociraptor:8889
      - JWT_SECRET=${JWT_SECRET}
      - PORTAL_USER=${PORTAL_USER:-admin}
      - PORTAL_PASS=${PORTAL_PASS}
    volumes:
      - portal-db:/app/data
      - suricata-logs:/data/suricata:ro
      - zeek-logs:/data/zeek:ro
      - wazuh-certs:/app/certs:ro
      - yara-rules-data:/opt/yara-rules
      - sigma-rules-data:/opt/sigma-rules
      - prometheus-targets:/etc/prometheus/targets
      - /var/run/docker.sock:/var/run/docker.sock:ro
    group_add:
      - "0"
    networks:
      soc-net:
        ipv4_address: 172.20.0.21
    depends_on:
      - wazuh-manager
      - ollama
      - grafana

  # ────────────────────────────────────────────────────────────────
  # CERT GENERATOR — runs once, creates self-signed TLS cert if absent
  # Replace server.crt/server.key with a proper cert for production.
  # ────────────────────────────────────────────────────────────────
  certgen:
    image: alpine
    container_name: soc-certgen
    restart: "no"
    volumes:
      - nginx-certs:/certs
    command: sh -c "apk add --no-cache openssl 2>/dev/null && ([ -f /certs/server.crt ] && echo 'Certificate already exists.' || (openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout /certs/server.key -out /certs/server.crt -subj '/CN=soc-portal/O=SOC Platform/C=ZA' && echo 'Self-signed certificate generated.'))"

  # ────────────────────────────────────────────────────────────────
  # NGINX (reverse proxy — HTTPS on 443, HTTP redirects to HTTPS)
  # ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: soc-nginx
    restart: unless-stopped
    mem_limit: 64m
    memswap_limit: 64m
    ports:
      - "80:80"
      - "443:443"
    environment:
      # base64("admin:<WAZUH_API_PASSWORD>") — set in .env
      # Generate: echo -n "admin:YourPassword" | base64
      - WAZUH_BASIC_AUTH_B64=${WAZUH_BASIC_AUTH_B64}
    volumes:
      # Template is processed by nginx entrypoint via envsubst on startup
      - ./configs/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      # Override built-in default.conf so only our server blocks are active
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
      - nginx-certs:/etc/nginx/certs:ro
    networks:
      soc-net:
        ipv4_address: 172.20.0.2
    depends_on:
      - soc-portal
      - certgen

  # ────────────────────────────────────────────────────────────────
  # PORTAL DB BACKUP — daily snapshot of soc.db, 7-day retention
  # Backups land in the portal-backups volume.
  # To restore: docker cp soc-portal-backup:/backups/<file> . && docker cp <file> soc-portal:/app/data/soc.db
  # ────────────────────────────────────────────────────────────────
  portal-backup:
    image: alpine
    container_name: soc-portal-backup
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    volumes:
      - portal-db:/data:ro
      - portal-backups:/backups
    command: >
      sh -c "while true; do
        cp /data/soc.db /backups/soc-$$(date +%Y%m%d-%H%M).db 2>/dev/null || true;
        find /backups -name 'soc-*.db' -mtime +7 -delete 2>/dev/null || true;
        echo \"Backup completed at $$(date)\";
        sleep 86400;
      done"
    depends_on:
      - soc-portal

  # ────────────────────────────────────────────────────────────────
  # DETECTION RULES INIT — clones YARA and Sigma rule repos once
  # Re-run manually: docker compose run --rm init-rules
  # Update after clone: POST /api/hunting/update
  # ────────────────────────────────────────────────────────────────
  init-rules:
    image: alpine:latest
    container_name: soc-init-rules
    restart: "no"
    volumes:
      - yara-rules-data:/opt/yara-rules
      - sigma-rules-data:/opt/sigma-rules
    command: >
      sh -c "
        apk add --no-cache git > /dev/null 2>&1;
        if [ ! -d /opt/yara-rules/.git ]; then
          echo 'Cloning YARA rules...';
          git clone --depth=1 https://github.com/Yara-Rules/rules.git /opt/yara-rules;
        else echo 'YARA rules already cloned.'; fi;
        if [ ! -d /opt/sigma-rules/.git ]; then
          echo 'Cloning Sigma rules...';
          git clone --depth=1 https://github.com/SigmaHQ/sigma.git /opt/sigma-rules;
        else echo 'Sigma rules already cloned.'; fi;
        echo 'Done.'
      "

  # ────────────────────────────────────────────────────────────────
  # LOG CLEANER — daily compression + rotation of IDS/proxy/SIEM logs
  # Strategy: compress logs > 1 day old (saves 70-90% disk), delete > 30 days
  # Active files (eve.json, current/ zeek logs) have recent mtime — not touched
  # ────────────────────────────────────────────────────────────────
  log-cleaner:
    image: alpine
    container_name: soc-log-cleaner
    restart: unless-stopped
    mem_limit: 32m
    memswap_limit: 32m
    volumes:
      - zeek-logs:/data/zeek
      - suricata-logs:/data/suricata
      - nginx-logs:/data/nginx
      - wazuh-logs:/data/wazuh
    command: >
      sh -c "while true; do
        echo \"[log-cleaner] Compress+rotate at $$(date)\";
        find /data/zeek     -type f -name '*.log'  -mtime +1 -not -name '*.gz' -exec gzip -9 {} \; 2>/dev/null;
        find /data/suricata -type f -name '*.log'  -mtime +1 -not -name '*.gz' -exec gzip -9 {} \; 2>/dev/null;
        find /data/suricata -type f -name '*.json' -mtime +1 -not -name 'eve.json' -not -name '*.gz' -exec gzip -9 {} \; 2>/dev/null;
        find /data/nginx    -type f -name '*.log'  -mtime +1 -not -name '*.gz' -exec gzip -9 {} \; 2>/dev/null;
        find /data/zeek     -type f -name '*.gz'   -mtime +30 -delete 2>/dev/null;
        find /data/suricata -type f -name '*.gz'   -mtime +30 -delete 2>/dev/null;
        find /data/nginx    -type f -name '*.gz'   -mtime +30 -delete 2>/dev/null;
        find /data/wazuh    -type f -name '*.log'  -mtime +30 -delete 2>/dev/null;
        echo \"[log-cleaner] Done\";
        sleep 86400;
      done"

  # ────────────────────────────────────────────────────────────────
  # OPENCTI DEPENDENCIES  (profile: full — not started by default)
  # Enable: add COMPOSE_PROFILES=full to .env, then ./setup.sh start
  # ────────────────────────────────────────────────────────────────
  opencti-redis:
    image: redis:7.2-alpine
    container_name: soc-opencti-redis
    restart: unless-stopped
    mem_limit: 128m
    memswap_limit: 128m

    volumes:
      - opencti-redis-data:/data
    networks:
      soc-net:
        ipv4_address: 172.20.0.31

  opencti-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: soc-opencti-rabbitmq
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m

    environment:
      - RABBITMQ_DEFAULT_USER=${OPENCTI_RABBITMQ_USER:-opencti}
      - RABBITMQ_DEFAULT_PASS=${OPENCTI_RABBITMQ_PASS:-opencti}
    volumes:
      - opencti-rabbitmq-data:/var/lib/rabbitmq
    networks:
      soc-net:
        ipv4_address: 172.20.0.32

  opencti-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: soc-opencti-minio
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m

    command: server /data
    environment:
      - MINIO_ROOT_USER=${OPENCTI_MINIO_USER:-opencti}
      - MINIO_ROOT_PASSWORD=${OPENCTI_MINIO_PASS:-openctipass}
    volumes:
      - opencti-minio-data:/data
    networks:
      soc-net:
        ipv4_address: 172.20.0.33

  opencti-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: soc-opencti-elasticsearch
    restart: unless-stopped
    mem_limit: 1g
    memswap_limit: 1g
    depends_on:
      - sysctl-init
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms256m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - opencti-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      soc-net:
        ipv4_address: 172.20.0.34

  # ────────────────────────────────────────────────────────────────
  # OPENCTI (threat intelligence platform)  (profile: full)
  # ────────────────────────────────────────────────────────────────
  opencti:
    image: opencti/platform:6.1.2
    container_name: soc-opencti
    restart: unless-stopped
    mem_limit: 1536m
    memswap_limit: 1536m

    environment:
      - NODE_OPTIONS=--max-old-space-size=1024
      - APP__PORT=8080
      - APP__BASE_PATH=/opencti
      - APP__BASE_URL=http://opencti:8080/opencti
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL:-admin@soc.local}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD:-ChangeThisOpenCTI1!}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN:-00000000-0000-0000-0000-000000000000}
      - APP__APP_LOGS__LOGS_LEVEL=error
      - REDIS__HOSTNAME=opencti-redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://opencti-elasticsearch:9200
      - MINIO__ENDPOINT=opencti-minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${OPENCTI_MINIO_USER:-opencti}
      - MINIO__SECRET_KEY=${OPENCTI_MINIO_PASS:-openctipass}
      - RABBITMQ__HOSTNAME=opencti-rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${OPENCTI_RABBITMQ_USER:-opencti}
      - RABBITMQ__PASSWORD=${OPENCTI_RABBITMQ_PASS:-opencti}
    networks:
      soc-net:
        ipv4_address: 172.20.0.35
    depends_on:
      - opencti-redis
      - opencti-rabbitmq
      - opencti-minio
      - opencti-elasticsearch

  # ────────────────────────────────────────────────────────────────
  # VELOCIRAPTOR (endpoint visibility & DFIR)  (profile: full)
  # GUI: https://<server-ip>:8889  (direct, own TLS — not proxied)
  # Agent enrollment port: 8001
  # ────────────────────────────────────────────────────────────────
  velociraptor:
    build:
      context: ./velociraptor
      dockerfile: Dockerfile
    container_name: soc-velociraptor
    restart: unless-stopped
    mem_limit: 256m
    memswap_limit: 256m

    environment:
      - VEL_USER=admin
      - VEL_PASSWORD=${VELOCIRAPTOR_ADMIN_PASSWORD:-ChangeThisVelo1!}
    volumes:
      - velociraptor-data:/velociraptor
    ports:
      - "8889:8889"
      - "8001:8001"
    networks:
      soc-net:
        ipv4_address: 172.20.0.16
