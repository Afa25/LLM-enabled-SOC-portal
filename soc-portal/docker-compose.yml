# ╔══════════════════════════════════════════════════════════════════╗
# ║         OPEN-SOURCE SOC PLATFORM — DOCKER COMPOSE               ║
# ║  Wazuh · Grafana · Zeek · Suricata · OpenCTI · Velociraptor     ║
# ║  Ollama · Portal                                                 ║
# ╚══════════════════════════════════════════════════════════════════╝

networks:
  soc-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

volumes:
  wazuh-indexer-data:
  wazuh-manager-data:
  wazuh-logs:
  grafana-data:
  prometheus-data:
  ollama-models:
  portal-db:
  portal-backups:
  zeek-logs:
  suricata-logs:
  nginx-logs:
  nginx-certs:
  wazuh-dashboard-config:
  opencti-elasticsearch-data:
  opencti-redis-data:
  opencti-rabbitmq-data:
  opencti-minio-data:
  velociraptor-data:

services:

  # ────────────────────────────────────────────────────────────────
  # WAZUH INDEXER (OpenSearch)
  # ────────────────────────────────────────────────────────────────
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.3
    container_name: soc-wazuh-indexer
    restart: unless-stopped
    hostname: wazuh-indexer
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
      - network.host=0.0.0.0
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./configs/wazuh/indexer/opensearch.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
      - ./configs/wazuh/certs:/usr/share/wazuh-indexer/config/certs:ro
    networks:
      soc-net:
        ipv4_address: 172.20.0.10
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/9200' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────────
  # WAZUH MANAGER
  # ────────────────────────────────────────────────────────────────
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.3
    container_name: soc-wazuh-manager
    restart: unless-stopped
    hostname: wazuh-manager
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - FILEBEAT_SSL_VERIFICATION_MODE=none
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat-key.pem
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-logs:/var/ossec/logs
      - ./configs/wazuh/manager/ossec.conf:/var/ossec/etc/ossec.conf:ro
      - ./configs/wazuh/manager/local_rules.xml:/var/ossec/etc/rules/local_rules.xml:ro
      - ./configs/wazuh/certs:/etc/ssl:ro
    ports:
      - "1514:1514/udp"
      - "1514:1514/tcp"
      - "1515:1515"
      - "514:514/udp"
      - "55000:55000"
    networks:
      soc-net:
        ipv4_address: 172.20.0.11
    depends_on:
      wazuh-indexer:
        condition: service_healthy

  # ────────────────────────────────────────────────────────────────
  # WAZUH DASHBOARD
  # ────────────────────────────────────────────────────────────────
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.3
    container_name: soc-wazuh-dashboard
    restart: unless-stopped
    hostname: wazuh-dashboard
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASSWORD}
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=${WAZUH_DASHBOARD_PASSWORD}
      - API_USERNAME=wazuh-wui
      - API_PASSWORD=${WAZUH_API_PASSWORD}
    volumes:
      - ./configs/wazuh/dashboard/opensearch_dashboards.yml:/usr/share/wazuh-dashboard/config/opensearch_dashboards.yml:ro
      - ./configs/wazuh/certs:/usr/share/wazuh-dashboard/certs:ro
      - wazuh-dashboard-config:/usr/share/wazuh-dashboard/data/wazuh/config
    networks:
      soc-net:
        ipv4_address: 172.20.0.12
    depends_on:
      - wazuh-indexer
      - wazuh-manager

  # ────────────────────────────────────────────────────────────────
  # GRAFANA
  # ────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana-oss:10.4.2
    container_name: soc-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      # SSO — anonymous access gated by Nginx auth_request.
      # Viewer role: portal users can read dashboards but cannot modify them.
      # Direct Grafana login (admin credentials from .env) grants full access.
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_AUTH_DISABLE_LOGIN_FORM=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      soc-net:
        ipv4_address: 172.20.0.13
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/health | grep -q ok"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ────────────────────────────────────────────────────────────────
  # PROMETHEUS
  # ────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: soc-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=/prometheus/'
      - '--web.route-prefix=/prometheus/'
    volumes:
      - prometheus-data:/prometheus
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      soc-net:
        ipv4_address: 172.20.0.14

  # ────────────────────────────────────────────────────────────────
  # NODE EXPORTER
  # NOTE: pid:host removed — not supported on Windows Docker Desktop
  # ────────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:v1.7.0
    container_name: soc-node-exporter
    restart: unless-stopped
    networks:
      soc-net:
        ipv4_address: 172.20.0.15

  # ────────────────────────────────────────────────────────────────
  # ZEEK (network traffic analysis)
  # Using zeekurity/zeek — the correct public image
  # ────────────────────────────────────────────────────────────────
  zeek:
    image: zeek/zeek:latest
    container_name: soc-zeek
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
    volumes:
      - zeek-logs:/usr/local/zeek/logs
      - ./configs/zeek/local.zeek:/usr/local/zeek/share/zeek/site/local.zeek:ro
    environment:
      - ZEEK_INTERFACE=${SOC_NETWORK_INTERFACE:-eth0}
    command: zeek -i ${SOC_NETWORK_INTERFACE:-eth0} /usr/local/zeek/share/zeek/site/local.zeek

  # ────────────────────────────────────────────────────────────────
  # SURICATA (network IDS/IPS)
  # ────────────────────────────────────────────────────────────────
  suricata:
    image: jasonish/suricata:latest
    container_name: soc-suricata
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_RAW
      - NET_ADMIN
      - SYS_NICE
    volumes:
      - suricata-logs:/var/log/suricata
      - ./configs/suricata/suricata.yaml:/etc/suricata/suricata.yaml:ro
    command: -i ${SOC_NETWORK_INTERFACE:-eth0} --af-packet

  # ────────────────────────────────────────────────────────────────
  # OLLAMA (local LLM — no API key needed)
  # ────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:0.4.7
    container_name: soc-ollama
    restart: unless-stopped
    volumes:
      - ollama-models:/root/.ollama
    networks:
      soc-net:
        ipv4_address: 172.20.0.20
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo >/dev/tcp/localhost/11434' 2>/dev/null && echo ok || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ────────────────────────────────────────────────────────────────
  # OLLAMA MODEL PULLER (runs once, then exits)
  # ────────────────────────────────────────────────────────────────
  ollama-init:
    image: ollama/ollama:0.4.7
    container_name: soc-ollama-init
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling ${OLLAMA_MODEL:-llama3.2:3b} (first run only)..."
        ollama pull ${OLLAMA_MODEL:-llama3.2:3b}
        echo "Model ready."
    networks:
      soc-net:

  # ────────────────────────────────────────────────────────────────
  # SOC PORTAL
  # ────────────────────────────────────────────────────────────────
  soc-portal:
    build:
      context: ./portal
      dockerfile: Dockerfile
    container_name: soc-portal
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - WAZUH_MANAGER_URL=https://wazuh-manager:55000
      - WAZUH_USER=wazuh-wui
      - WAZUH_PASS=${WAZUH_API_PASSWORD}
      - WAZUH_INDEXER_URL=https://wazuh-indexer:9200
      - WAZUH_INDEXER_USER=admin
      - WAZUH_INDEXER_PASS=${WAZUH_INDEXER_PASSWORD}
      - OLLAMA_URL=http://ollama:11434
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.2:3b}
      # TLS: CA cert is mounted below. Set WAZUH_TLS_SKIP_VERIFY=true in .env
      # only if you have not yet deployed the Wazuh certs directory.
      - WAZUH_CA_CERT=/app/certs/root-ca.pem
      - WAZUH_TLS_SKIP_VERIFY=${WAZUH_TLS_SKIP_VERIFY:-false}
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_USER=${GRAFANA_USER:-admin}
      - GRAFANA_PASS=${GRAFANA_PASSWORD}
      - OPENCTI_URL=http://opencti:8080/opencti
      - OPENCTI_TOKEN=${OPENCTI_ADMIN_TOKEN}
      - VELOCIRAPTOR_URL=http://velociraptor:8889
      - JWT_SECRET=${JWT_SECRET}
      - PORTAL_USER=${PORTAL_USER:-admin}
      - PORTAL_PASS=${PORTAL_PASS}
    volumes:
      - portal-db:/app/data
      - suricata-logs:/data/suricata:ro
      - zeek-logs:/data/zeek:ro
      - ./configs/wazuh/certs/root-ca.pem:/app/certs/root-ca.pem:ro
    networks:
      soc-net:
        ipv4_address: 172.20.0.21
    depends_on:
      - wazuh-manager
      - ollama
      - grafana

  # ────────────────────────────────────────────────────────────────
  # CERT GENERATOR — runs once, creates self-signed TLS cert if absent
  # Replace server.crt/server.key with a proper cert for production.
  # ────────────────────────────────────────────────────────────────
  certgen:
    image: alpine
    container_name: soc-certgen
    restart: "no"
    volumes:
      - nginx-certs:/certs
    command: sh -c "apk add --no-cache openssl 2>/dev/null && ([ -f /certs/server.crt ] && echo 'Certificate already exists.' || (openssl req -x509 -nodes -days 3650 -newkey rsa:2048 -keyout /certs/server.key -out /certs/server.crt -subj '/CN=soc-portal/O=SOC Platform/C=ZA' && echo 'Self-signed certificate generated.'))"

  # ────────────────────────────────────────────────────────────────
  # NGINX (reverse proxy — HTTPS on 443, HTTP redirects to HTTPS)
  # ────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: soc-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      # base64("admin:<WAZUH_API_PASSWORD>") — set in .env
      # Generate: echo -n "admin:YourPassword" | base64
      - WAZUH_BASIC_AUTH_B64=${WAZUH_BASIC_AUTH_B64}
    volumes:
      # Template is processed by nginx entrypoint via envsubst on startup
      - ./configs/nginx/nginx.conf.template:/etc/nginx/templates/nginx.conf.template:ro
      # Override built-in default.conf so only our server blocks are active
      - ./configs/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - nginx-logs:/var/log/nginx
      - nginx-certs:/etc/nginx/certs:ro
    networks:
      soc-net:
        ipv4_address: 172.20.0.2
    depends_on:
      - soc-portal
      - certgen

  # ────────────────────────────────────────────────────────────────
  # PORTAL DB BACKUP — daily snapshot of soc.db, 7-day retention
  # Backups land in the portal-backups volume.
  # To restore: docker cp soc-portal-backup:/backups/<file> . && docker cp <file> soc-portal:/app/data/soc.db
  # ────────────────────────────────────────────────────────────────
  portal-backup:
    image: alpine
    container_name: soc-portal-backup
    restart: unless-stopped
    volumes:
      - portal-db:/data:ro
      - portal-backups:/backups
    command: >
      sh -c "while true; do
        cp /data/soc.db /backups/soc-$$(date +%Y%m%d-%H%M).db 2>/dev/null || true;
        find /backups -name 'soc-*.db' -mtime +7 -delete 2>/dev/null || true;
        echo \"Backup completed at $$(date)\";
        sleep 86400;
      done"
    depends_on:
      - soc-portal

  # ────────────────────────────────────────────────────────────────
  # OPENCTI DEPENDENCIES
  # ────────────────────────────────────────────────────────────────
  opencti-redis:
    image: redis:7.2-alpine
    container_name: soc-opencti-redis
    restart: unless-stopped
    volumes:
      - opencti-redis-data:/data
    networks:
      soc-net:
        ipv4_address: 172.20.0.31

  opencti-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: soc-opencti-rabbitmq
    restart: unless-stopped
    environment:
      - RABBITMQ_DEFAULT_USER=${OPENCTI_RABBITMQ_USER:-opencti}
      - RABBITMQ_DEFAULT_PASS=${OPENCTI_RABBITMQ_PASS:-opencti}
    volumes:
      - opencti-rabbitmq-data:/var/lib/rabbitmq
    networks:
      soc-net:
        ipv4_address: 172.20.0.32

  opencti-minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: soc-opencti-minio
    restart: unless-stopped
    command: server /data
    environment:
      - MINIO_ROOT_USER=${OPENCTI_MINIO_USER:-opencti}
      - MINIO_ROOT_PASSWORD=${OPENCTI_MINIO_PASS:-openctipass}
    volumes:
      - opencti-minio-data:/data
    networks:
      soc-net:
        ipv4_address: 172.20.0.33

  opencti-elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: soc-opencti-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile:  { soft: 65536, hard: 65536 }
    volumes:
      - opencti-elasticsearch-data:/usr/share/elasticsearch/data
    networks:
      soc-net:
        ipv4_address: 172.20.0.34

  # ────────────────────────────────────────────────────────────────
  # OPENCTI (threat intelligence platform)
  # ────────────────────────────────────────────────────────────────
  opencti:
    image: opencti/platform:6.1.2
    container_name: soc-opencti
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=4096
      - APP__PORT=8080
      - APP__BASE_PATH=/opencti
      - APP__BASE_URL=http://opencti:8080/opencti
      - APP__ADMIN__EMAIL=${OPENCTI_ADMIN_EMAIL:-admin@soc.local}
      - APP__ADMIN__PASSWORD=${OPENCTI_ADMIN_PASSWORD:-ChangeThisOpenCTI1!}
      - APP__ADMIN__TOKEN=${OPENCTI_ADMIN_TOKEN:-00000000-0000-0000-0000-000000000000}
      - APP__APP_LOGS__LOGS_LEVEL=error
      - REDIS__HOSTNAME=opencti-redis
      - REDIS__PORT=6379
      - ELASTICSEARCH__URL=http://opencti-elasticsearch:9200
      - MINIO__ENDPOINT=opencti-minio
      - MINIO__PORT=9000
      - MINIO__USE_SSL=false
      - MINIO__ACCESS_KEY=${OPENCTI_MINIO_USER:-opencti}
      - MINIO__SECRET_KEY=${OPENCTI_MINIO_PASS:-openctipass}
      - RABBITMQ__HOSTNAME=opencti-rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${OPENCTI_RABBITMQ_USER:-opencti}
      - RABBITMQ__PASSWORD=${OPENCTI_RABBITMQ_PASS:-opencti}
    networks:
      soc-net:
        ipv4_address: 172.20.0.35
    depends_on:
      - opencti-redis
      - opencti-rabbitmq
      - opencti-minio
      - opencti-elasticsearch

  # ────────────────────────────────────────────────────────────────
  # VELOCIRAPTOR (endpoint visibility & DFIR)
  # GUI: https://<server-ip>:8889  (direct, own TLS)
  # Agent enrollment port: 8001
  # ────────────────────────────────────────────────────────────────
  velociraptor:
    image: velocidex/velociraptor:v0.7.0-4
    container_name: soc-velociraptor
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        if [ ! -f /velociraptor/server.config.yaml ]; then
          velociraptor config generate > /velociraptor/server.config.yaml
          velociraptor --config /velociraptor/server.config.yaml \
            user add admin ${VELOCIRAPTOR_ADMIN_PASSWORD:-ChangeThisVelo1!} --role administrator
        fi
        exec velociraptor --config /velociraptor/server.config.yaml frontend -v
    environment:
      - VELOCIRAPTOR_ADMIN_PASSWORD=${VELOCIRAPTOR_ADMIN_PASSWORD:-ChangeThisVelo1!}
    volumes:
      - velociraptor-data:/velociraptor
    ports:
      - "8889:8889"
      - "8001:8001"
    networks:
      soc-net:
        ipv4_address: 172.20.0.16
