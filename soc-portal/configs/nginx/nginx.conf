events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;
  gzip         on;
  gzip_types   text/plain text/css application/json application/javascript text/xml application/xml;

  # Docker internal DNS
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  # Write logs to volume so CrowdSec can read them
  access_log /var/log/nginx/access.log;
  error_log  /var/log/nginx/error.log warn;

  limit_req_zone $binary_remote_addr zone=portal:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;

  # Wazuh admin credentials (base64 of admin:SecurePassword1!)
  # Used by Nginx to inject basic-auth after SSO validation
  map $host $wazuh_basic_auth {
    default "Basic ${WAZUH_BASIC_AUTH_B64}";
  }

  server {
    listen 80;
    server_name _;

    # ─────────────────────────────────────────────────────────────
    # INTERNAL — portal SSO validation endpoint (nginx auth_request)
    # Subrequest forwards the browser's Cookie header automatically.
    # Returns 200 + X-Auth-User header on success, 401 on failure.
    # ─────────────────────────────────────────────────────────────
    location = /auth-check {
      internal;
      set $upstream_portal http://soc-portal:4000;
      proxy_pass              $upstream_portal/api/auth/validate;
      proxy_pass_request_body off;
      proxy_set_header        Content-Length   "";
      proxy_set_header        X-Original-URI   $request_uri;
      proxy_read_timeout      5s;
    }

    # ── Redirect unauthenticated external-service requests to portal login ──
    location @sso_login {
      return 302 /login?next=$request_uri;
    }

    # ── SOC Portal (main app) ──────────────────────────────────
    location / {
      limit_req zone=portal burst=20 nodelay;
      set $upstream_portal http://soc-portal:4000;
      proxy_pass         $upstream_portal;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }

    # ── API (longer timeout for LLM + SSE) ───────────────────
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      set $upstream_portal http://soc-portal:4000;
      proxy_pass         $upstream_portal;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_read_timeout 360s;
      proxy_buffering    off;
      proxy_cache        off;
    }

    # ── Grafana ───────────────────────────────────────────────
    # SSO: auth_request validates portal cookie, then injects
    # X-Webauth-User so Grafana proxy-auth logs the user in automatically.
    location /grafana/ {
      auth_request      /auth-check;
      error_page 401 = @sso_login;

      set $upstream_grafana http://grafana:3000;
      proxy_pass       $upstream_grafana/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Wazuh Dashboard ───────────────────────────────────────
    # SSO: auth_request validates portal cookie, then Nginx injects
    # Basic auth so Wazuh Dashboard auto-authenticates the request.
    # requestHeadersAllowlist in opensearch_dashboards.yml already
    # includes "Authorization", so this header is forwarded to OpenSearch.
    location /wazuh/ {
      auth_request      /auth-check;
      error_page 401 = @sso_login;

      set $upstream_wazuh http://wazuh-dashboard:5601;
      proxy_pass          $upstream_wazuh;
      proxy_set_header    Host              $host;
      proxy_set_header    X-Real-IP         $remote_addr;
      proxy_set_header    X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header    Authorization     $wazuh_basic_auth;
    }

    # ── Prometheus ────────────────────────────────────────────
    # SSO: gate behind portal auth (Prometheus has no built-in auth).
    location /prometheus/ {
      auth_request      /auth-check;
      error_page 401 = @sso_login;

      set $upstream_prometheus http://prometheus:9090;
      proxy_pass       $upstream_prometheus;
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
    }
  }
}
