events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;
  gzip         on;
  gzip_types   text/plain text/css application/json application/javascript text/xml application/xml;

  # Docker internal DNS — resolve upstreams at request time, not startup
  resolver 127.0.0.11 valid=30s ipv6=off;
  resolver_timeout 5s;

  limit_req_zone $binary_remote_addr zone=portal:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;

  server {
    listen 80;
    server_name _;

    # ── SOC Portal (main app) ──────────────────────────────
    location / {
      limit_req zone=portal burst=20 nodelay;
      set $upstream_portal http://soc-portal:4000;
      proxy_pass         $upstream_portal;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }

    # ── API (longer timeout for LLM generation + SSE) ─────
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      set $upstream_portal http://soc-portal:4000;
      proxy_pass         $upstream_portal;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_read_timeout 360s;
      proxy_buffering    off;
      proxy_cache        off;
    }

    # ── Grafana ───────────────────────────────────────────
    location /grafana/ {
      set $upstream_grafana http://grafana:3000;
      proxy_pass       $upstream_grafana/;
      proxy_set_header Host              $host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Wazuh Dashboard (HTTP on port 5601) ───────────────
    # Do NOT strip the /wazuh prefix — dashboard uses rewriteBasePath: true
    # and expects requests at /wazuh/... which it strips internally.
    location /wazuh/ {
      set $upstream_wazuh http://wazuh-dashboard:5601;
      proxy_pass          $upstream_wazuh;
      proxy_set_header    Host            $host;
      proxy_set_header    X-Real-IP       $remote_addr;
      proxy_set_header    X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # ── Prometheus ────────────────────────────────────────
    # prometheus started with --web.route-prefix=/prometheus/
    location /prometheus/ {
      set $upstream_prometheus http://prometheus:9090;
      proxy_pass       $upstream_prometheus;
      proxy_set_header Host       $host;
      proxy_set_header X-Real-IP  $remote_addr;
    }

    # ── OpenVAS (start separately: docker compose up -d openvas) ──
    location /openvas/ {
      set $upstream_openvas http://openvas:9392;
      proxy_pass          $upstream_openvas/;
      proxy_set_header    Host            $host;
      proxy_set_header    X-Real-IP       $remote_addr;
      proxy_read_timeout  120s;
    }
  }
}
