events { worker_connections 1024; }

http {
  include      /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile     on;
  gzip         on;
  gzip_types   text/plain text/css application/json application/javascript text/xml application/xml;

  limit_req_zone $binary_remote_addr zone=portal:10m rate=30r/m;
  limit_req_zone $binary_remote_addr zone=api:10m    rate=120r/m;

  upstream portal   { server soc-portal:4000;    }
  upstream grafana  { server grafana:3000;        }
  upstream wazuh_ui { server wazuh-dashboard:443; }
  upstream openvas  { server openvas:9392;        }

  server {
    listen 80;
    server_name _;

    # ── SOC Portal (main app) ──────────────────────────────
    location / {
      limit_req zone=portal burst=20 nodelay;
      proxy_pass         http://portal;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_read_timeout 300s;
    }

    # ── API (longer timeout for LLM generation + SSE) ─────
    location /api/ {
      limit_req zone=api burst=50 nodelay;
      proxy_pass         http://portal;
      proxy_set_header   Host            $host;
      proxy_set_header   X-Real-IP       $remote_addr;
      proxy_read_timeout 360s;
      proxy_buffering    off;
      proxy_cache        off;
    }

    # ── Grafana ───────────────────────────────────────────
    location /grafana/ {
      proxy_pass       http://grafana/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
    }

    # ── Wazuh Dashboard ───────────────────────────────────
    location /wazuh/ {
      proxy_pass          https://wazuh_ui/;
      proxy_ssl_verify    off;
      proxy_set_header    Host            $host;
      proxy_set_header    X-Real-IP       $remote_addr;
    }

    # ── OpenVAS ───────────────────────────────────────────
    location /openvas/ {
      proxy_pass       http://openvas:9392/;
      proxy_set_header Host            $host;
      proxy_set_header X-Real-IP       $remote_addr;
    }
  }
}
