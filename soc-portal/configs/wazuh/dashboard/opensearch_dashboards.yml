# ═══════════════════════════════════════════════════════════════
#  Wazuh Dashboard (OpenSearch Dashboards) Configuration
# ═══════════════════════════════════════════════════════════════

server.host: 0.0.0.0
server.port: 443
server.ssl.enabled: true
server.ssl.certificate: /usr/share/wazuh-dashboard/certs/dashboard.pem
server.ssl.key: /usr/share/wazuh-dashboard/certs/dashboard-key.pem

opensearch.hosts: https://wazuh-indexer:9200
opensearch.ssl.verificationMode: none
opensearch.username: kibanaserver
opensearch.password: ${WAZUH_DASHBOARD_PASSWORD}
opensearch.requestHeadersAllowlist: ["securitytenant","Authorization"]

opensearch_security.multitenancy.enabled: true
opensearch_security.multitenancy.tenants.enable_global: true
opensearch_security.multitenancy.tenants.enable_private: false
opensearch_security.multitenancy.tenants.preferred: ["Global","Default"]
opensearch_security.readonly_mode.roles: ["kibana_read_only"]
opensearch_security.cookie.secure: false

uiSettings.overrides.defaultRoute: /app/wazuh

server.basePath: /wazuh
server.rewriteBasePath: true
