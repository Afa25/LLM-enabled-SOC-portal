global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']

  - job_name: 'soc-portal'
    static_configs:
      - targets: ['soc-portal:4000']
    metrics_path: /api/health

  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
    metrics_path: /metrics

  # ── Dynamic agent targets ─────────────────────────────────────
  # The portal writes /etc/prometheus/targets/agents.json when agents
  # enroll. Each entry = { "targets": ["<ip>:<port>"], "labels": {...} }
  # Linux agents: install node-exporter (port 9100)
  # Windows agents: install windows-exporter (port 9182)
  - job_name: 'agents'
    file_sd_configs:
      - files:
          - '/etc/prometheus/targets/agents.json'
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
